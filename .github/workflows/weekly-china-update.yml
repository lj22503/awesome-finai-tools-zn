name: Weekly China Platforms Update

# awesome-finai-tools-zn 国内平台周更巡检
# 每周一 17:30 北京时间（= 09:30 UTC）执行
# 来源：ClawHub Public API + npm Registry
#
# ClawHub API 使用规范：
#   - 仅公开只读端点 (GET /api/v1/skills, /api/v1/search)
#   - 遵守限流 (匿名 3000 req/min)
#   - 回链 ClawHub 原始页面
#   - 不暗示官方背书

on:
  schedule:
    # 每周一 09:30 UTC = 北京时间 17:30
    - cron: '30 9 * * 1'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  china-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run China platforms scanner
        run: python scripts/update_china_platforms.py

      - name: Regenerate README and llms.txt
        run: python scripts/generate_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md llms.txt
          if git diff --cached --quiet; then
            echo "本次无变更，跳过提交"
          else
            git commit -m "chore(data): 国内平台周更 $(date -u +%Y-%m-%d)"
            git push
          fi
